[project]
name = "media-studio"
version = "0.1.0"
description = "自媒体智能体平台：采集 + AI 分析 + 一键成片（DTK / XHS / MPT 融合）"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "openai>=1.40",
    "mcp>=1.2",
    "cryptography>=43.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20",
    "faster-whisper>=1.0",
    # faster-whisper 依赖 av.open(metadata_errors=...)（av 15+ 已移除）；
    # av 14.3+/14.4 无 cp312 Windows wheel，锁 14.2
    "av>=14,<14.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]
