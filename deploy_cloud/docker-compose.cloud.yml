# 自媒体智能体平台 · 云端部署（全栈：MPT + studio + DTK 采集）
services:
  mpt:
    # 官方预构建镜像（跳过服务器上的漫长构建）；config/存储经挂载注入
    image: ghcr.io/harry0703/moneyprinterturbo:latest
    container_name: mpt-api
    restart: unless-stopped
    # 官方镜像默认 CMD 是 Streamlit WebUI(8501)；这里覆盖为 API 服务
    # （main.py 读取挂载的 config.toml 的 listen_host/listen_port）
    command: ["python", "main.py"]
    volumes:
      - ./data/mpt-storage:/MoneyPrinterTurbo/storage
      - ./mpt-config.toml:/MoneyPrinterTurbo/config.toml:ro
    environment:
      GITHUB_ACTIONS: "false"
    healthcheck:
      # 镜像里没有 curl，用 python 探活
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  gateway:
    build:
      context: ../media-studio
      dockerfile: ../deploy_cloud/studio.Dockerfile
    container_name: studio-gateway
    restart: unless-stopped
    command: ["uvicorn", "studio.gateway.app:app", "--host", "0.0.0.0", "--port", "8200"]
    environment:
      MPT_URL: "http://mpt:8000"
      ANALYTICS_URL: "http://analytics:8100"
      PUBLIC_MPT_BASE: "/mpt"
      DTK_URL: "http://host.docker.internal:8000"
      GATEWAY_API_KEY: "${GATEWAY_API_KEY}"
      STUDIO_DATA_DIR: "/data"
      # 一键成片 local 模式的素材目录（与 mpt 容器共享同一宿主目录）
      STUDIO_LOCAL_VIDEOS_DIR: "/data/local_videos"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/studio:/data
      - ./data/mpt-storage/local_videos:/data/local_videos
    depends_on:
      - mpt

  analytics:
    build:
      context: ../media-studio
      dockerfile: ../deploy_cloud/studio.Dockerfile
    container_name: studio-analytics
    restart: unless-stopped
    command: ["uvicorn", "studio.analytics.app:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      STUDIO_DATA_DIR: "/data"
    volumes:
      - ./data/studio:/data

  web:
    image: nginx:alpine
    container_name: studio-web
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ./web-dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - gateway
      - mpt
