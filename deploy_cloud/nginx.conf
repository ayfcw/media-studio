# 口令鉴权（替代 Basic Auth：微信内置浏览器不支持 Basic 弹窗）。
# 校验 Cookie studio_token，正确则放行；否则引导到 /welcome.html 输入口令。
# ⚠️ 安全占位符：ACCESS_TOKEN / GATEWAY_API_KEY 的真实值只存在服务器上的
#    /opt/mediastudio/deploy_cloud/nginx.conf，入库前已脱敏。
map $cookie_studio_token $studio_blocked {
    default 1;
    "ACCESS_TOKEN" 0;
}

server {
    listen 9000;
    server_name _;
    client_max_body_size 200m;

    # 口令入口：校验通过则种一年 Cookie 并回首页
    location = /enter {
        if ($arg_token != "ACCESS_TOKEN") { return 302 /welcome.html?bad=1; }
        add_header Set-Cookie "studio_token=ACCESS_TOKEN; Path=/; Max-Age=31536000; HttpOnly" always;
        return 302 /;
    }

    # 口令页本身不受限制
    location = /welcome.html {
        root /usr/share/nginx/html;
    }

    # 后端 API → 编排网关（注入 API Key，前端无需感知）
    location /api/ {
        if ($studio_blocked) { return 401; }
        proxy_pass http://gateway:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Key "GATEWAY_API_KEY";
        proxy_read_timeout 300s;
    }

    # 成片产物（视频在线播放/下载）→ MPT
    location /mpt/ {
        if ($studio_blocked) { return 401; }
        proxy_pass http://mpt:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # 平台前端（静态）
    location / {
        if ($studio_blocked) { return 302 /welcome.html; }
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
